[build]
  base    = "frontend"
  publish = "."

# Redirect all API calls to your Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://biodiscover-platform.onrender.com/api/:splat"
  status = 200
  force  = true

# SPA fallback
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
